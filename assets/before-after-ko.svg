<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 432" width="960" height="432" role="img" aria-label="MISTOLOGY 도입 전후 비교 — 무방비 터미널 vs 자동 방어 터미널">
  <defs>
    <pattern id="termScanKo" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="1" fill="#FFFFFF" fill-opacity="0.018"/>
    </pattern>
  </defs>

  <!-- Outer Matte Charcoal Frame -->
  <rect x="1" y="1" width="958" height="430" rx="12" fill="#0A0A0A" stroke="#262626" stroke-width="1.5"/>
  <rect x="2" y="2" width="956" height="428" rx="11" fill="url(#termScanKo)"/>

  <!-- Top Header Strip -->
  <text x="24" y="29" fill="#A3A3A3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.0">TERMINAL DIFF  //  BEFORE (방어 없음)  vs  AFTER (MISTOLOGY 자동 방어)</text>
  <text x="936" y="29" text-anchor="end" fill="#525252" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.2">동일 작업: currency.py에 VND · KWD 추가</text>

  <!-- ========================================================= -->
  <!-- LEFT TERMINAL: BEFORE (UNPROTECTED / ZERO DEFENSE)        -->
  <!-- ========================================================= -->
  <g transform="translate(20, 44)">
    <rect x="0" y="0" width="450" height="368" rx="8" fill="#0E0B0B" stroke="#451A1A" stroke-width="1.3"/>
    <!-- Titlebar -->
    <path d="M0 8 Q0 0 8 0 L442 0 Q450 0 450 8 L450 30 L0 30 Z" fill="#181111"/>
    <line x1="0" y1="30" x2="450" y2="30" stroke="#3B1818" stroke-width="1"/>
    <circle cx="16" cy="15" r="4.2" fill="#EF4444"/>
    <circle cx="30" cy="15" r="4.2" fill="#525252"/>
    <circle cx="44" cy="15" r="4.2" fill="#525252"/>
    <text x="60" y="19" fill="#FCA5A5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="700">BEFORE · 미적용</text>
    <!-- Exposed Badge -->
    <rect x="316" y="6" width="124" height="18" rx="4" fill="#3B1111" stroke="#991B1B" stroke-width="1"/>
    <text x="378" y="18.5" text-anchor="middle" fill="#FCA5A5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.2" font-weight="700">방어 없음 · 무방비</text>

    <!-- Terminal Body -->
    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.1">
      <text x="14" y="52" fill="#737373">1.</text>
      <text x="32" y="52" fill="#E5E5E5">$ agent &quot;currency.py에 VND · KWD 추가해줘&quot;</text>

      <text x="14" y="72" fill="#F87171">[경고]</text>
      <text x="58" y="72" fill="#A3A3A3">사전 조회 없음 (기억 의존 · 거대 .md 전체 읽기)</text>

      <text x="14" y="96" fill="#737373">2.</text>
      <text x="32" y="96" fill="#D4D4D4">수정  services/fx/currency.py</text>
      <text x="32" y="113" fill="#FCA5A5">  ├─ 기존 표준 대신 유사 헬퍼를 중복 구현</text>
      <text x="32" y="130" fill="#FCA5A5">  ├─ 폐기된 v1 분기(KRW/JPY 하드코딩) 재발</text>
      <text x="32" y="147" fill="#F87171">  └─ 결합된 settlement.py · csv_export.py 누락</text>

      <text x="14" y="173" fill="#737373">3.</text>
      <text x="32" y="173" fill="#E5E5E5">$ pytest tests/test_settlement.py</text>
      <rect x="14" y="182" width="422" height="58" rx="4" fill="#1C0E0E" stroke="#5C1D1D" stroke-width="1"/>
      <text x="22" y="198" fill="#F87171" font-weight="700">FAILED test_vnd_settlement_fee</text>
      <text x="22" y="214" fill="#FCA5A5">KeyError: &#39;VND&#39; in SETTLEMENT_FEE_BPS</text>
      <text x="22" y="230" fill="#FCA5A5">AssertionError: KWD 1.250 → 1.25 절삭 (csv)</text>

      <text x="14" y="261" fill="#737373">4.</text>
      <text x="32" y="261" fill="#A3A3A3">증상만 임시 수정 후 impact 점검 없이 종료</text>
      <text x="32" y="278" fill="#F87171">  ├─ 2-hop csv_export.py 정밀도 버그 방치</text>
      <text x="32" y="295" fill="#F87171">  └─ 오답 미기록 → 다음 세션도 같은 지뢰 반복</text>

      <text x="14" y="321" fill="#F59E0B">결과:</text>
      <text x="54" y="321" fill="#FCA5A5">코드 중복 + 연쇄 회귀 + 비정합성(decoherence) 누적</text>
    </g>

    <!-- tmux-style Bottom Status Bar -->
    <path d="M0 342 L450 342 L450 360 Q450 368 442 368 L8 368 Q0 368 0 360 Z" fill="#2A0F0F"/>
    <line x1="0" y1="342" x2="450" y2="342" stroke="#5C1D1D" stroke-width="1"/>
    <text x="12" y="359" fill="#FCA5A5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" font-weight="700">[무방비]</text>
    <text x="72" y="359" fill="#D4D4D4" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5">29k 토큰 낭비 · 결합 누락 2/2 · 기록 0건</text>
  </g>

  <!-- ========================================================= -->
  <!-- RIGHT TERMINAL: AFTER (MISTOLOGY v0.3.0 GUARDED)          -->
  <!-- ========================================================= -->
  <g transform="translate(490, 44)">
    <rect x="0" y="0" width="450" height="368" rx="8" fill="#090F0B" stroke="#14532D" stroke-width="1.3"/>
    <!-- Titlebar -->
    <path d="M0 8 Q0 0 8 0 L442 0 Q450 0 450 8 L450 30 L0 30 Z" fill="#0F1A13"/>
    <line x1="0" y1="30" x2="450" y2="30" stroke="#164E2E" stroke-width="1"/>
    <circle cx="16" cy="15" r="4.2" fill="#525252"/>
    <circle cx="30" cy="15" r="4.2" fill="#525252"/>
    <circle cx="44" cy="15" r="4.2" fill="#22C55E"/>
    <text x="60" y="19" fill="#86EFAC" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="700">AFTER · MISTOLOGY v0.3</text>
    <!-- Guarded Badge -->
    <rect x="316" y="6" width="124" height="18" rx="4" fill="#0A2E1A" stroke="#16A34A" stroke-width="1"/>
    <text x="378" y="18.5" text-anchor="middle" fill="#4ADE80" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.2" font-weight="700">자동 방어 · 훅 활성</text>

    <!-- Terminal Body -->
    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.1">
      <text x="14" y="52" fill="#525252">1.</text>
      <text x="32" y="52" fill="#E5E5E5">$ agent &quot;currency.py에 VND · KWD 추가해줘&quot;</text>

      <text x="14" y="72" fill="#4ADE80">[자동훅]</text>
      <text x="68" y="72" fill="#A3E635">mistology search -b (4.0 ms · 320 토큰)</text>

      <rect x="14" y="81" width="422" height="72" rx="4" fill="#0B1911" stroke="#166534" stroke-width="1"/>
      <text x="22" y="97" fill="#4ADE80" font-weight="700">★표준   currency.py → CURRENCY_EXPONENTS 재사용</text>
      <text x="22" y="113" fill="#86EFAC">1-HOP   ← settlement.py (LEDGER_MINOR_DIVISORS)</text>
      <text x="22" y="129" fill="#86EFAC">2-HOP   ← csv_export.py (REPORT_DECIMALS 동기화)</text>
      <text x="22" y="145" fill="#FBBF24">금지    v1: KRW/JPY 하드코딩 · 기본 divisor 100</text>

      <text x="14" y="173" fill="#525252">2.</text>
      <text x="32" y="173" fill="#D4D4D4">첫 시도에서 결합된 3개 파일 계약 일괄 반영</text>
      <text x="32" y="190" fill="#4ADE80">  ✓ currency.py  ✓ settlement.py  ✓ csv_export.py</text>

      <text x="14" y="214" fill="#525252">3.</text>
      <text x="32" y="214" fill="#E5E5E5">$ pytest tests/ &amp;&amp; mistology impact</text>
      <rect x="14" y="223" width="422" height="44" rx="4" fill="#0B1911" stroke="#166534" stroke-width="1"/>
      <text x="22" y="239" fill="#4ADE80" font-weight="700">PASSED  15/15 테스트 통과 (회귀 0건)</text>
      <text x="22" y="255" fill="#86EFAC">IMPACT  미수정 결합 파일 0건 (3/3 동시 검증 완료)</text>

      <text x="14" y="287" fill="#525252">4.</text>
      <text x="32" y="287" fill="#4ADE80">[종료게이트]</text>
      <text x="106" y="287" fill="#D4D4D4">파급 점검 및 검증된 규약·오답 자동 확인</text>
      <text x="32" y="304" fill="#86EFAC">  └─ .mistology/notes/ PR 커밋에 함께 축적</text>

      <text x="14" y="324" fill="#22C55E" font-weight="700">결과:</text>
      <text x="54" y="324" fill="#BBF7D0">중복 0 · 2-hop 연쇄 방어 · 프로젝트 정합성 유지</text>
    </g>

    <!-- tmux-style Bottom Status Bar -->
    <path d="M0 342 L450 342 L450 360 Q450 368 442 368 L8 368 Q0 368 0 360 Z" fill="#0B2917"/>
    <line x1="0" y1="342" x2="450" y2="342" stroke="#166534" stroke-width="1"/>
    <text x="12" y="359" fill="#4ADE80" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" font-weight="700">[방어완료]</text>
    <text x="84" y="359" fill="#D4D4D4" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5">320 토큰 · 2-hop 차단 · 자동 훅 강제</text>
  </g>
</svg>
