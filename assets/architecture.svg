<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 326" width="960" height="326" role="img" aria-label="MISTOLOGY Architecture — Verified Capture, Git Ontology Notes, SQLite FTS5 + Directed 2-Hop Graph, Ultra-Compact Preflight Briefing">
