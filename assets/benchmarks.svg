    <text x="614" y="64" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.8" font-weight="700">320 tok</text>
    <text x="706" y="64" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.8" font-weight="700">4.0 ms</text>
    <text x="782" y="64" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.8" font-weight="700">2.1k tok</text>

    <!-- Row 2: Beads v1.3.4 -->
    <text x="22" y="96" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500">Beads v1.3.4</text>
    <rect x="152" y="81" width="264" height="20" rx="5" fill="#131E33"/>
