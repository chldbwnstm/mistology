    <text x="18" y="66" fill="#FCD34D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.8">14.5x</text>
    <text x="18" y="88" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600">2.1k vs 8.7k–30.1k tokens</text>
