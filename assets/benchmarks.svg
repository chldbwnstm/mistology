<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 398" width="960" height="398" role="img" aria-label="MISTOLOGY Empirical Benchmarks — 100% Clean Recall, 320 Prompt Tokens, 4.0ms CLI, 4.2x-14.5x Live Agent Memory Savings vs Top Open-Source Competitors">
  <defs>
    <linearGradient id="bBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="barMist" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="barComp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.82"/>
    </linearGradient>
