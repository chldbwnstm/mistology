    <!-- Row 3: claude-mem -->
    <text x="22" y="127" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500">claude-mem</text>
    <rect x="152" y="112" width="264" height="20" rx="5" fill="#131E33"/>
    <rect x="152" y="112" width="20" height="20" rx="5" fill="url(#barComp)"/>
    <text x="434" y="126" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.8">7% (6 poison)</text>
