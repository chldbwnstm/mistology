    <text x="706" y="126" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.8">66 ms</text>
    <text x="782" y="126" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.8">13.9k (6.7x)</text>

    <!-- Row 4: MCP Memory -->
    <text x="22" y="158" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500">MCP Memory</text>
    <rect x="152" y="143" width="264" height="20" rx="5" fill="#131E33"/>
    <rect x="152" y="143" width="20" height="20" rx="5" fill="url(#barComp)"/>
    <text x="434" y="157" fill="#FCA5A5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.8">7% (23 poison)</text>
    <text x="614" y="157" fill="#FCA5A5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.8">11,499 tok</text>
