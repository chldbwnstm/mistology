  <!-- Outer Container -->
  <rect x="1" y="1" width="958" height="396" rx="16" fill="url(#bBg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Section Eyebrow -->
  <text x="34" y="34" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.3">AT A GLANCE  •  4-WAY OPEN-SOURCE MEMORY BENCHMARK (400 SESSIONS · 50-MODULE LIVE REPO)</text>

  <!-- KPI Card 1: Clean Recall -->
  <g transform="translate(34, 50)">
    <rect x="0" y="0" width="214" height="116" rx="12" fill="#0D1627" stroke="#1E293B" stroke-width="1.2"/>
    <rect x="16" y="0" width="56" height="2.5" fill="#34D399"/>
    <text x="18" y="26" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.9">CLEAN RECALL (27 CORE)</text>
    <text x="18" y="66" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.8">100%</text>
    <text x="18" y="88" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600">27/27 hits  •  0 poisoned</text>
    <text x="18" y="104" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5">9.0x – 13.5x vs OSS memory</text>
  </g>

  <!-- KPI Card 2: Prompt Tokens -->
  <g transform="translate(260, 50)">
    <rect x="0" y="0" width="214" height="116" rx="12" fill="#0D1627" stroke="#1E293B" stroke-width="1.2"/>
    <rect x="16" y="0" width="56" height="2.5" fill="#38BDF8"/>
    <text x="18" y="26" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.9">PREFLIGHT TOKENS</text>
    <text x="18" y="66" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.8">320 tok</text>
    <text x="18" y="88" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600">-98.9% vs MISTAKES.md</text>
    <text x="18" y="104" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5">3.2x – 35.9x lighter vs OSS</text>
  </g>

  <!-- KPI Card 3: CLI Speed -->
  <g transform="translate(486, 50)">
