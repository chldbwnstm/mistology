    <text x="22" y="184" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.3">O(1) invariant from 3 weeks (32 sessions) to 3 months (400 sessions) — 3.06x to 296.9x win across every core retrieval &amp; cost metric.</text>
